[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaquest-research-engine-2"
version = "0.1.0"
description = "A small local portal for validated OHLCV datasets."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.31,<1", "pandas_market_calendars==5.5.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
browser = ["playwright==1.64.1"]

[tool.setuptools.packages.find]
include = ["alphaquest*"]

[tool.setuptools.package-data]
alphaquest = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
